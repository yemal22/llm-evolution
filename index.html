:root{--ink:#0f172a;--muted:#64748b;--edge:#dbe2e9;--soft:#f5f7fa;--blue:#4f6d9a;font:clamp(16px,1vw,23px) Calibri,Carlito,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:white}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}button{background:white;border:0}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue)}#rail{position:fixed;top:1.6vh;left:5.2%;right:5.2%;display:flex;gap:6px}#rail button{flex:1;min-width:0;text-align:left;border-top:3px solid var(--edge);padding:.35rem 0;color:var(--muted);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase}#rail button[aria-current=true]{border-color:var(--ink);color:var(--ink);font-weight:bold}main{position:absolute;inset:8vh 5.2vw 8vh;display:flex;flex-direction:column;gap:1.5vh}.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2vh}h1,h2,p,figure{margin:0}h1{font-size:clamp(2rem,3.65vw,4.2rem);line-height:1.08}.center{text-align:center;margin:auto;max-width:72rem}.center h1{font-size:clamp(2.7rem,5.4vw,6rem)}.center p{margin-top:2vh;font-size:clamp(1.1rem,2.1vw,2.5rem)}.lead{font-size:clamp(1.15rem,2.05vw,2.3rem);line-height:1.25}.muted,cite,a{color:var(--muted)}cite{font-size:.88rem;font-style:normal}.cols{display:grid;grid-template-columns:1.14fr 1fr;gap:3.4vw;align-items:center}.stack{display:grid;gap:2vh}.card,.eq{border:1px solid var(--edge);border-radius:10px;padding:1.1rem 1.3rem;background:var(--soft)}.eq{font:600 clamp(1rem,1.65vw,1.8rem)/1.4 ui-monospace,monospace;overflow-wrap:anywhere;border-left:4px solid var(--ink)}.label{font-size:.95rem;color:var(--muted);line-height:1.3}.claim{font-size:clamp(1.2rem,2.5vw,2.7rem);font-weight:bold;line-height:1.15}.reveal{animation:arrive .45s ease-out}@keyframes arrive{from{opacity:.05;transform:translateY(8px)}}.steps{padding-left:1.4em;margin:0;display:grid;gap:1.3vh}.steps li::marker{color:var(--muted)}.diagram{width:100%;height:auto;max-height:39vh;display:block}.diagram text{font-family:Calibri,Arial,sans-serif;fill:var(--ink)}.chips{display:flex;align-items:center;flex-wrap:wrap;gap:.4em}.chip{padding:.4em .6em;border:1px solid var(--edge);border-radius:6px;background:var(--soft)}#visual{font-size:clamp(.95rem,1.3vw,1.5rem)}#visual svg{height:105px}.barrow{display:grid;grid-template-columns:4.2em 1fr 3em;gap:.6em;align-items:center;margin:.25em 0}.track{height:.85em;background:#e0e6ed}.fill{height:100%;background:var(--blue);transition:width .2s}.knob{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;margin:.4em 0}.knob input{accent-color:var(--blue);width:min(36%,14rem)}.mask{display:grid;grid-template-columns:repeat(5,1fr);text-align:center}.mask span,.mask b{padding:.14rem}.open{background:#e6ebf2}.chosen{background:var(--blue);color:white}footer{position:fixed;bottom:1.4vh;left:5.2%;right:5.2%;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}footer button,footer select{padding:.32em .65em;border:1px solid var(--edge);border-radius:5px;background:white}footer button:disabled{opacity:.35}footer select{width:min(36vw,17em)}.road{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2vh 3vw}.road button{text-align:left;border-bottom:1px solid var(--edge);padding:1.2vh .4em;color:var(--muted);font-size:clamp(1rem,2vw,2rem)}.road button.active{border-left:4px solid var(--ink);color:var(--ink);background:var(--soft);font-weight:bold}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2vw}.big{font-size:clamp(2.2rem,4.3vw,4.8rem);font-weight:bold}.report{border-left:4px solid var(--blue);padding:1rem;background:var(--soft);font-size:clamp(1.1rem,2vw,2rem)}@media(max-width:750px),(max-height:520px){main{position:static;min-height:78svh;margin:5rem 5vw 4rem}.cols{grid-template-columns:1fr}.diagram{max-height:26vh}.content{gap:1.1rem}.stack{gap:.8rem}#rail{position:absolute;display:grid;grid-template-columns:repeat(4,1fr)}#rail button{font-size:.6rem}footer{background:white;bottom:0;padding:.35rem 0}.pair{gap:.5rem}.card{padding:.8rem}}@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}

const data=[[["Counting", "Where does a prediction come from?", "Statistical language models · mid-20th century onward"], ["The dry wind carries ___", "Read the prefix and guess a continuation. A language model assigns probability to each possible next token."], ["dust × 3 / sand × 1", "Our tiny corpus contains four occurrences of “carries”. Count what follows each one."], ["dust 0.75 / sand 0.25", "Divide each count by four. The estimate describes this corpus. It says nothing by itself about tomorrow’s weather."], ["P(w₁…wₜ) = ∏ᵢ P(wᵢ ∣ w₁…wᵢ₋₁)", "The chain rule is exact. A bigram model approximates each conditional using only the previous token. A trigram keeps two. Longer contexts distinguish more cases but leave fewer observations per case."], ["What probability does the bigram assign to fog?", "Zero under raw counts. With a three-word vocabulary and add-one smoothing the counts become 4, 2 and 1, so fog gets 1/7."]], [["Counting", "What does it mean to predict well?", "Held-out likelihood"], ["dust: 0.75 → dust observed", "The loss for one observed token is its negative log probability. Confident correct predictions are inexpensive."], ["−ln(0.75) ≈ 0.288", "A model assigning the same token 0.25 pays about 1.386 nats. A zero probability would give infinite loss."], ["exp[(0.288 + 1.386)/2] ≈ 2.31", "For two observations, average their log losses and exponentiate. Perplexity measures effective uncertainty per token."], ["L = −(1/T) Σ log pθ(xₜ ∣ x<t)", "Split texts before fitting counts, preprocessing rules or parameters. Overlapping copies can make a model appear predictive on text it has already seen. Perplexity comparisons require comparable tokenization and test data."], ["Can lower perplexity guarantee more accurate weather answers?", "No. Perplexity scores observed text. Factual accuracy needs evidence and an evaluation of the answer."]], [["Representations", "How can a rare phrase borrow evidence?", "Bengio et al. · 2003; word2vec · 2013"], ["wind → [1, 0] / breeze → [0, 1]", "Distinct one-hot IDs are orthogonal. The IDs themselves encode no similarity."], ["wind → [0.8, 0.6] / breeze → [0.6, 0.8]", "An embedding table maps each ID to a learned vector. These illustrative unit vectors have dot product 0.96."], ["shared predictor → similar scores", "If the context vectors are close, a shared linear output layer gives similar logits. Evidence about “wind” can affect predictions after “breeze”."], ["z = W h + b; p = softmax(z)", "A feed-forward neural LM concatenates a fixed window of embeddings, transforms it, then predicts the next word. Gradients flow into the selected embedding rows. Skip-gram word2vec instead learns vectors by predicting nearby words from a center word."], ["What happens to “bank” in river bank and bank loan?", "A static table returns the same row in both contexts. Later layers must represent the difference."]], [["Representations", "What does the model see as one token?", "Subword tokenization · BPE"], ["l o w / l o w / l o w e r", "Begin with symbols and word boundaries. Count adjacent pairs inside words. In this toy corpus l–o and o–w tie."], ["lo w / lo w / lo w e r", "Choose l–o by a fixed tie-break. Merge its occurrences and recount the neighboring pairs."], ["low / low / low e r", "Merge lo–w. At inference apply the learned merge order. A frequent stem now uses one token even inside a rarer word."], ["text → symbols → ordered merges → IDs", "Vocabulary size trades embedding-table size against sequence length. A larger vocabulary can shorten sequences. Actual tokenizers differ in byte handling, normalization and whitespace. A rare spelling may consume a large portion of a context window."], ["Does one token mean one word?", "No. “lower” still takes three symbols with this toy merge list. A different learned vocabulary could encode it in one."]], [["Memory", "Can the model remember which wind we meant?", "RNNs and LSTMs · 1990s–2010s"], ["dry → h₁", "A recurrent cell combines each input with a hidden state. The same parameters act at every time step."], ["wind → h₂ → carries → h₃", "A fixed-width state must carry the earlier clue “dry” across intervening words."], ["0.8¹⁰ ≈ 0.107 / 0.8⁵⁰ ≈ 0.000014", "If each backward step scales a gradient by 0.8, a distant learning signal fades. LSTM gates give information a controlled additive route."], ["cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ gₜ", "The forget gate controls retention, the input gate controls writing and an output gate controls reading. When f stays near one, cell information can survive many steps. Recurrent state updates still depend on the previous step."], ["With forget gate 1 and input gate 0, what changes in the cell?", "The cell state is copied exactly. The visible hidden state can still change through the output gate."]], [["Memory", "Why did translation need attention?", "Seq2seq · 2014; Bahdanau attention · 2014"], ["le / vent / sec", "An encoder produces one state for each source word. Early encoder–decoders used one final summary to initialize decoding."], ["the dry ___ → [0.1, 0.8, 0.1]", "At this decoding step, a learned compatibility function scores each encoder state. Softmax makes the weights sum to one."], ["0.1 h₁ + 0.8 h₂ + 0.1 h₃ → wind", "The context vector emphasizes “vent”. The decoder can compute different weights for its next output."], ["cₜ = Σⱼ αₜⱼ hⱼ", "These weights illustrate alignment, not a measurement from a trained system. Cross-attention reads a second sequence. Self-attention uses queries, keys and values from the same sequence. The original attentive translation models retained recurrence."], ["Why keep every encoder state?", "The decoder can revisit a specific source position after generation begins, relieving the single-summary bottleneck."]], [["Transformer", "Work one attention head by hand", "Vaswani et al. · 2017"], ["dry / wind / carries", "At “carries”, use a one-dimensional query q = 1. Assign toy keys [0, 2, 0] and scalar values [1, 4, 2]."], ["scores 0 / 2 / 0", "Multiply each key by the query. Since the key dimension is one, division by its square root leaves the scores unchanged."], ["weights .107 / .787 / .107", "Softmax divides [1, exp(2), 1] by their sum. The weighted output is approximately 3.47. Change the middle key below and track its influence."], ["Attention(Q,K,V) = softmax(QKᵀ/√dₖ + M)V", "For T tokens, Q and K have T rows and dₖ columns. QKᵀ is T by T. Normalize across each query row. The result mixes value vectors, so its width is dᵥ. A larger key score changes the mixture even if the values stay fixed."], ["If all keys are zero, what value comes out?", "Each token gets one third. The output becomes (1+4+2)/3 ≈ 2.33."]], [["Transformer", "Which words can each position read?", "Causal masking and parallel training"], ["dry / wind / carries / dust", "Each row asks a question. Each column supplies a key. Select a row to see the positions it may read."], ["past and self → visible / future → masked", "In a causal model the mask adds negative infinity to future scores before softmax. Their attention weights become zero."], ["dry → wind / wind → carries / carries → dust", "Shift labels by one position. During training all known positions can be scored together. Generation must wait for each newly selected token."], ["Mᵢⱼ = 0 if j ≤ i, else −∞", "Position information matters because dot-product mixing alone has no explicit distances. The original Transformer adds sinusoidal positions. RoPE rotates query and key coordinates so relative position affects their dot product."], ["May the “wind” row read “carries” when learning to predict it?", "No. It may read “dry” and “wind”. The target “carries” is used to score the output."]], [["Transformer", "What does a complete decoder block do?", "From one head to a vocabulary distribution"], ["IDs → embeddings → residual stream", "Start with one vector per token. A stack of blocks repeatedly updates those vectors."], ["attention → add / MLP → add", "In a pre-norm block, normalize before each sublayer. Attention mixes positions; the feed-forward network transforms each position independently."], ["last vector → logits → softmax", "Project the final normalized vector into vocabulary space. Multiple heads run different projections simultaneously and their outputs are mixed."], ["H′ = H + Attn(Norm(H)); H″ = H′ + MLP(Norm(H′))", "Residual additions require matching widths. The MLP can expand and contract internally. Unlike the ViT class token used for image classification, a causal LM can use the last prefix position to predict the next token. The 2017 translation Transformer used an encoder and decoder and a different norm placement."], ["Where can information move from “dry” to “carries”?", "In the attention sublayer. The MLP can then transform what “carries” has collected."]], [["Pretraining", "Why did BERT, GPT and T5 diverge?", "GPT and BERT · 2018; T5 · 2019"], ["BERT: dry [MASK] carries dust", "An encoder uses context from both sides to reconstruct selected masked tokens. The resulting representations support downstream tasks."], ["GPT: dry wind carries → dust", "A causal decoder predicts the next token. Repeating this operation directly generates continuations."], ["T5: dry <gap> carries → <gap> wind", "An encoder reads the corrupted source. A causal decoder reconstructs missing spans using cross-attention to the source."], ["objective + visibility pattern → learned task", "Pretraining reuses supervision implicit in raw text. GPT-2 emphasized zero-shot transfer. GPT-3 demonstrated in-context task learning with demonstrations in a prompt. A prompted prediction uses fixed parameters; fine-tuning updates them."], ["Which model may look at “dust” to reconstruct “wind”?", "In the illustrated BERT objective both sides are visible. The causal GPT prediction before “wind” cannot see later words."]], [["Pretraining", "Where does a training example come from?", "Corpus construction and optimization"], ["documents → filter → deduplicate", "Sources can include web crawls, books and code. Common Crawl is a collection of web snapshots. A crawl is a starting point for constructing a corpus."], ["tokens → windows → shifted labels", "Pack compatible examples and handle document boundaries deliberately. Training samples need inputs and targets aligned to the same tokenizer."], ["loss → gradients → optimizer update", "Backpropagation differentiates average cross-entropy. An optimizer such as AdamW uses gradient estimates and weight decay to update weights."], ["∂L/∂zⱼ = pⱼ − 𝟙[j = target]", "If the model gives dust probability 0.2 and dust is correct, its logit gradient is −0.8. Gradient descent pushes that logit up. Repeated documents can overweight a pattern. Split and deduplicate with evaluation contamination in mind."], ["A validation article appears verbatim in training. What has gone wrong?", "A held-out score now mixes generalization and memorization. Use document-level and near-duplicate checks across splits."]], [["Pretraining", "How should a fixed compute budget be spent?", "Kaplan et al. · 2020; Chinchilla · 2022"], ["parameters N / training tokens D", "Capacity and training exposure are separate choices. Both influence validation loss."], ["6 × N × D ≈ training FLOPs", "A rough dense Transformer estimate makes a trade-off visible. At fixed compute, doubling N roughly halves the available token budget."], ["larger undertrained model ↔ smaller model trained longer", "Chinchilla tested allocations across many model sizes and training lengths. Its estimates favored more tokens than several earlier large-model recipes used."], ["L ≈ E + A/Nᵅ + B/Dᵝ", "The fitted terms describe capacity and data effects within a training regime. Optimal allocation depends on fitted exponents and constants. Inference cost, data quality and repeated tokens can shift the choice. The live budget below illustrates compute accounting only."], ["Does the budget equation tell you which model will score best?", "No. It specifies affordable pairs. Held-out measurements or an empirical loss model help compare them."]], [["Generation", "How do the same weights produce different replies?", "Decoding and the KV cache"], ["scores: dust 2 / sand 1 / fog 0", "The model emits logits. Greedy decoding selects the largest. Sampling can choose any token with positive probability."], ["divide logits by temperature", "Softmax turns scaled logits into probabilities. With T=1 these scores give approximately 0.665, 0.245 and 0.090."], ["append token → repeat", "Nucleus sampling retains the smallest sorted set reaching probability p and renormalizes. With p=0.8 and T=1, dust and sand survive."], ["pᵢ(T) = exp(zᵢ/T) / Σⱼ exp(zⱼ/T)", "During prompt prefill the model computes keys and values for all prompt positions. Cached keys and values can be reused for later tokens. A longer context still grows cache memory and the number of prior positions a new query reads."], ["If temperature rises, can fog overtake dust in rank?", "No. Positive temperature preserves logit order. It changes the relative probabilities."]], [["Post-training", "How does a predictor become an assistant?", "InstructGPT · 2022; DPO · 2023"], ["prompt + demonstration → SFT", "Supervised fine-tuning increases the likelihood of example assistant responses. Format and behavior are part of the training signal."], ["one prompt → two replies → preference", "A rater chooses a preferred response. A reward model can learn a scalar score from many such pairs."], ["RLHF with PPO / direct preference optimization", "PPO can optimize a policy against learned rewards with a reference-policy penalty. DPO trains directly on comparisons using relative log probabilities against a reference."], ["Δ = log π(y⁺|x)/πref(y⁺|x) − log π(y⁻|x)/πref(y⁻|x)", "DPO minimizes −log σ(βΔ) over preference pairs. A larger relative margin lowers this pair’s loss. Raters may favor a fluent answer with weak evidence. Preference learning and truth verification measure different things."], ["If both responses improve equally in log ratio, does the DPO margin grow?", "No. The common increase cancels when the two log ratios are subtracted."]], [["Systems", "Which changes make a model cheaper to use?", "Sparse experts, LoRA and quantization"], ["router → experts 2 and 5", "A sparse mixture-of-experts layer selects a subset of feed-forward networks per token. Total parameters can grow faster than active computation."], ["frozen W + low-rank update BA", "LoRA trains small factors for selected weight matrices. For a 1024 × 1024 matrix and rank 8, the two factors contain 16,384 trainable parameters."], ["16-bit → 4-bit weights", "Quantization uses fewer bits per stored weight. Scales and runtime overhead affect actual memory savings. Quality and speed depend on hardware and calibration."], ["W′x = Wx + B(Ax)", "These techniques act at different stages and can coexist. Sparse routing adds communication and balancing costs. LoRA lowers adaptation cost. Quantization reduces weight storage and can change numerical outputs."], ["Does a model with eight experts always use all eight for one token?", "No. Top-k routing chooses k experts for that token. Other tokens can take different routes."]], [["Systems", "How can a model use a new field report?", "Retrieval-augmented generation · 2020 onward"], ["question → retrieve passages", "A user asks what a station observed. A retriever ranks candidate passages by lexical overlap or learned similarity."], ["question + selected evidence → generator", "The retrieved text becomes input context. A new document can affect answers without changing model weights."], ["claim → inspect supporting passage", "Toy report: “Visibility fell to 3 km. Cause unconfirmed.” A grounded answer can report 3 km. Inferring dust as the cause exceeds the evidence."], ["retrieval recall → answer faithfulness → task accuracy", "A missing relevant document is a retrieval failure. Ignoring a retrieved report is a generation failure. A tool-using model can request a calculator or database query and consume its result on the next step. These mechanisms introduce external evidence or computation."], ["What should the assistant say if asked whether dust caused the decline?", "The report records reduced visibility and leaves the cause unconfirmed. Another observation would be needed for attribution."]], [["Systems", "How do images enter a language model?", "Vision–language instruction tuning · 2023"], ["image → patch features", "A vision encoder maps image patches to continuous vectors, much like the class demonstration in the reference course."], ["project features → language width", "In a LLaVA-style system, a learned connector maps image features into the language model’s embedding space."], ["visual features + prompt → text", "A decoder conditions generated tokens on visual features and text. Image–text training teaches alignment. Instruction data teaches how to respond."], ["V = projector(vision_encoder(image))", "A projector aligns vector dimensions; paired training gives the mapping semantic meaning. A low-resolution image can lose small text or distant objects before the language model receives anything. Evaluate with contrastive image pairs and controlled changes."], ["If a caption stays unchanged after the pictured sign changes, what would you test?", "Check resolution, crop the sign, and compare answers on matched images. Separate visual recognition errors from language priors."]], [["Reasoning", "When does more inference compute help?", "Sampling, verification and reasoning models · 2022–25"], ["question → several candidate solutions", "Extra generation can explore multiple approaches. Each candidate costs tokens and time."], ["verify each → select supported result", "For arithmetic, check the final calculation. For code, run task-specific tests. A verifier only catches errors it measures."], ["one draw p=.4 / three draws ≥1 correct ≈ .784", "With independent draws, 1−(1−p)³ gives the chance of at least one correct candidate. Selection needs a strong verifier to realize the gain."], ["pass@k under independence = 1 − (1−p)ᵏ", "This is a toy probability calculation. Real samples can share systematic errors. DeepSeek-R1 explored reinforcement learning for reasoning, including rule-based rewards on verifiable tasks. More generated text alone does not certify a conclusion."], ["If every candidate repeats one mistaken assumption, what does majority vote do?", "It can reinforce the same error. Diversity and a verifier with independent evidence matter."]], [["Evaluation", "Can you tell which part failed?", "Capstone · a grounded climate assistant"], ["A. The assistant gives 30 km", "The retrieved station report states 3 km. Check extraction and unit conversion before changing the retriever."], ["B. The assistant blames dust", "The same report says “cause unconfirmed”. Score evidence support separately from numeric correctness."], ["C. The assistant quotes yesterday", "Inspect retrieval timestamps and filter by station and date. A faithful summary of the wrong report can still answer incorrectly."], ["coverage = answered / asked; selective accuracy = correct / answered", "Build a held-out set by station and date. Include missing reports, conflicting observations and unfamiliar phrasing. Compare a retrieval-only baseline, a closed-book model and a retrieval-augmented system. Record latency, citations and abstentions alongside accuracy."], ["A system answers 8 of 10 questions and gets 7 right. How should you report it?", "Coverage is 80%. Accuracy among answered questions is 87.5%. Counting abstentions as unsuccessful gives 70% overall. State which denominator suits the application."]]], sources=["https://web.stanford.edu/~jurafsky/slp3/", "https://web.stanford.edu/~jurafsky/slp3/", "https://www.jmlr.org/papers/v3/bengio03a.html", "https://aclanthology.org/P16-1162/", "https://doi.org/10.1162/neco.1997.9.8.1735", "https://arxiv.org/abs/1409.0473", "https://arxiv.org/abs/1706.03762", "https://arxiv.org/abs/1706.03762", "https://arxiv.org/abs/1706.03762", "https://arxiv.org/abs/1910.10683", "https://web.stanford.edu/~jurafsky/slp3/", "https://arxiv.org/abs/2203.15556", "https://web.stanford.edu/~jurafsky/slp3/", "https://arxiv.org/abs/2305.18290", "https://arxiv.org/abs/2106.09685", "https://arxiv.org/abs/2005.11401", "https://arxiv.org/abs/2304.08485", "https://arxiv.org/abs/2501.12948", "https://arxiv.org/abs/2211.09110"];

const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const chips=arr=>'<div class="chips">'+arr.map(x=>'<span class="chip">'+esc(x)+'</span>').join('<span aria-hidden="true">→</span>')+'</div>';
function bars(labels,values,max=1){return values.map((v,i)=>'<div class="barrow"><span>'+labels[i]+'</span><div class="track"><div class="fill" style="width:'+100*v/max+'%"></div></div><b>'+v.toFixed(2)+'</b></div>').join('')}
function slider(label,min,max,step,start,draw){$('visual').innerHTML='<label class="knob">'+label+' <input id="knob" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+start+'"><output id="value"></output></label><div id="extra"></div>';function update(){$('value').textContent=$('knob').value;$('extra').innerHTML=draw(Number($('knob').value))} $('knob').oninput=update;update()}
function visual(){
 const el=$('visual');if(n===0&&s===2){el.innerHTML=bars(['dust','sand'],[.75,.25]);return}
 if(n===1){slider('Probability of observed token',.01,1,.01,.75,p=>chips(['p = '+p.toFixed(2),'loss = '+(-Math.log(p)).toFixed(3)+' nats']));return}

 if(n===7){let w=['dry','wind','carries','dust'];slider('Query row',1,4,1,2,row=>'<div class="mask"><b>Q ↓ K →</b>'+w.map(t=>'<b>'+t+'</b>').join('')+w.map((t,i)=>'<b>'+t+'</b>'+w.map((_,j)=>'<span class="'+(j>i?'muted':row===i+1?'chosen':'open')+'">'+(j>i?'−∞':'read')+'</span>').join('')).join('')+'</div>');return}
 if(n===11){slider('Parameters (billions)',1,20,1,5,N=>chips([N+' B parameters',(100/N).toFixed(1)+' B tokens','≈ 6 × 10²⁰ FLOPs']));return}
 if(n===12){slider('Temperature',.1,3,.1,1,t=>{let a=[2,1,0].map(z=>Math.exp(z/t)),sum=a.reduce((x,y)=>x+y);return bars(['dust','sand','fog'],a.map(x=>x/sum))});return}
 if(n===17){slider('Independent candidates',1,10,1,3,k=>bars(['single','any of '+k],[.4,1-.6**k]));return}
 if(n===4&&s===2){slider('Retention per step',.5,1,.01,.8,f=>bars(['1 step','10 steps','50 steps'],[f,f**10,f**50]));return}
 if(n===5&&s>0){el.innerHTML=bars(['le','vent','sec'],[.1,.8,.1]);return}
 if(n===13&&s===2){slider('Preference margin Δ',-4,4,.1,0,d=>chips(['β = 1','pair loss = '+Math.log1p(Math.exp(-d)).toFixed(3)]));return}
 if(n===14&&s===1){slider('Adapter rank',1,64,1,8,r=>chips(['A: '+r+' × 1024','B: 1024 × '+r,(2048*r).toLocaleString()+' trainable weights']));return}
 const ds=diagrams[n];el.innerHTML=chips(ds[Math.min(s,ds.length-1)]);
}

 ['Foundations',0,'What can we learn by counting words?'],

const inks=['#0f172a','#4f6d9a','#c5cfdb'];

 const label=(x,y,t,size=19,anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}">${esc(t)}</text>`;
 const box=(x,y,w,h,t,active=false)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${active?'#dce6f0':'#f8fafc'}" stroke="${active?inks[1]:inks[2]}"/>`+label(x+w/2,y+h/2+6,t);
 const dot=(x,y,r=6)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${inks[1]}"/>`;
 const flow=(names)=>names.map((t,i)=>box(12+i*495/names.length,76,465/names.length,56,t,i===Math.min(beat,names.length-1))).join('');
 const axes=()=>line(55,195,470,195)+line(55,195,55,20);

 const curve=f=>path(Array.from({length:81},(_,i)=>(55+i*5)+','+(194-155*f(i/80))));
 let a='';
 switch(index){
 case 0:a=box(16,80,135,51,'carries',true)+[0,1,2,3].map((_,i)=>line(151,105,245,32+i*49)+box(245,10+i*49,120,44,i===3?'sand':'dust',beat===2&&i<3)).join('');break;
 case 1:a=axes()+curve(x=>Math.min(1,-Math.log(.02+.98*x)/3.8))+label(270,222,'Probability assigned to the observed token')+label(68,24,'Loss',17,'start');break;
 case 2:a=axes()+line(55,195,310,85)+line(55,195,246,47)+dot(310,85)+dot(246,47)+label(323,88,'wind',19,'start')+label(257,48,'breeze',19,'start');break;
 case 3:a=[['l','o','w','e','r'],['lo','w','e','r'],['low','e','r']].slice(0,beat+1).map((r,k)=>r.map((t,i)=>box(30+i*79,15+k*67,72,45,t,i===0&&k>0)).join('')).join('');break;
 case 4:a=axes()+curve(x=>.8**(18*x))+label(266,222,'Recurrent steps')+label(64,21,'Retained signal',16,'start');break;
 case 5:case 6:{let words=index===5?['le','vent','sec']:['dry','wind','carries'];a=words.map((t,i)=>box(30+i*151,28,120,50,t,i===1&&beat>0)+line(90+i*151,78,239,152,inks[beat>0&&i===1?1:2],beat>0&&i===1?9:2)).join('')+box(166,152,146,50,index===5?'decoder':'query',true);break}
 case 7:a=[0,1,2,3].map(i=>[0,1,2,3].map(j=>box(110+j*54,6+i*53,48,46,j<=i?'✓':'×',j<=i)).join('')).join('');break;
 case 8:a=flow(['stream','attention','MLP','logits'])+path(['65,76','65,43','308,43','308,76'])+label(186,32,'residual connection');break;
 case 9:a=['BERT','GPT','T5'].map((t,i)=>label(55,44+i*64,t)+box(110,14+i*64,315,45,['dry  [MASK]  carries  dust','dry  wind  carries   →   ?','dry  [gap]  carries   →   wind'][i],i===beat)).join('');break;
 case 10:a=label(70,54,'Inputs')+label(70,147,'Targets')+['dry','wind','carries'].map((t,i)=>box(130+i*111,25,100,46,t)+line(180+i*111,71,180+i*111,113)+box(130+i*111,113,100,46,['wind','carries','dust'][i],true)).join('');break;
 case 11:a=axes()+curve(x=>1/(1+6*x))+label(277,221,'Model parameters →')+label(68,22,'Affordable training tokens',16,'start');break;
 case 12:a=['dust','sand','fog'].map((t,i)=>label(67,51+i*62,t)+box(115,22+i*62,[235,90,35][i],42,'',true)+label(375,50+i*62,['.665','.245','.090'][i])).join('')+label(240,219,'Illustrative distribution at T = 1');break;
 case 13:a=box(8,78,108,50,'prompt')+line(116,100,190,48)+line(116,100,190,155)+box(190,20,155,55,'chosen',beat>0)+box(190,128,155,55,'rejected')+line(345,48,410,95)+line(345,155,410,95)+label(449,100,'update',18);break;
 case 14:a=box(10,80,110,52,'router',true)+[1,2,3,4].map((t,i)=>line(120,106,260,28+i*49,i%2?inks[2]:inks[1],i%2?1:5)+box(260,7+i*49,160,42,'expert '+t,i%2===0)).join('');break;
 case 15:a=box(15,75,110,50,'question')+[0,1,2].map(i=>line(125,100,200,40+i*61)+box(200,17+i*61,125,45,'report '+(i+1),i===1)).join('')+line(325,101,371,101)+box(371,77,115,48,'answer',true);break;
 case 16:a=Array.from({length:16},(_,i)=>box(24+i%4*32,43+Math.floor(i/4)*32,29,29,'',(i%5===0))) .join('')+line(155,105,195,105)+box(195,78,128,54,'projection')+line(323,105,351,105)+box(351,78,139,54,'visual tokens',true);break;
 case 17:a=axes()+curve(x=>1-.6**(1+9*x))+label(258,220,'Independent candidate solutions →')+label(66,23,'P(at least one correct)',16,'start');break;
 case 18:a=Array.from({length:10},(_,i)=>box(17+i%5*91,25+Math.floor(i/5)*65,79,50,i<7?'✓':i===7?'×':'—',i<7)).join('')+label(242,192,'7 correct  ·  1 error  ·  2 abstentions');break;
 }
 return '<svg class="diagram" viewBox="0 0 500 230" role="img" aria-label="'+esc(data[index][0][1])+'">'+a+'</svg>';
}
const slides=[];
function add(id,type,part,lesson,builds){slides.push({id,type,part,lesson,builds})}
add('start','title',0,0,1);add('opening','hook',0,0,3);
sections.forEach(([name,start],part)=>{
 add('part-'+(part+1),'road',part,start,1);
 for(let i=start;i<(sections[part+1]?.[1]??data.length);i++){
  add('lesson-'+(i+1),'lesson',part,i,3);
  add('work-'+(i+1),'work',part,i,3);
 }
 if(part<sections.length-1)add('bridge-'+(part+1),'bridge',part,start,1);
});
add('lab','lab',6,18,3);add('recap','recap',6,18,3);
let pos=0,beat=0;
const stage=$('stage'), outline=$('outline');
const sourcesLabel=['Speech and Language Processing','Speech and Language Processing','Bengio et al. · A neural probabilistic language model','Sennrich et al. · Subword units','Hochreiter & Schmidhuber · Long short-term memory','Bahdanau et al. · Neural machine translation','Vaswani et al. · Attention is all you need','Vaswani et al. · Attention is all you need','Vaswani et al. · Attention is all you need','Raffel et al. · Text-to-text transfer','Speech and Language Processing','Hoffmann et al. · Compute-optimal training','Speech and Language Processing','Rafailov et al. · Direct preference optimization','Hu et al. · LoRA','Lewis et al. · Retrieval-augmented generation','Liu et al. · Visual instruction tuning','DeepSeek-AI · DeepSeek-R1','Liang et al. · Holistic evaluation of language models'];
const sectionsHtml=sections.map(([name],i)=>'<button data-go="part-'+(i+1)+'">'+name+'</button>').join('');
$('rail').innerHTML=sectionsHtml;
const targets=['Rules for counting continuations','A state that carries context','A token that can read other tokens','An objective and a corpus','A policy for generating replies','Evidence beyond the prompt','Tests that expose failure'];
const bridges=['Two sentences end in “carries”. One begins with a dry wind, the other with a truck. How can the first word still matter?','A decoder has read the whole sentence. How can it return directly to one particular word?','We have a network that can read context. What should we hide from it during training?','The model has learned probabilities. Who decides which token actually comes next?','The assistant sounds convincing. Where could it get today’s station reading?','The answer cites a report. How would you check that it used the right date, unit and observation?'];
function jump(id,b=0){location.hash=id+(b?'~'+(b+1):'')}
function route(){
 let [id,step]=location.hash.slice(1).split('~');let old=id.match(/^(\d+)\.(\d+)$/);
 if(old){id='lesson-'+old[1];step=old[2]}
 pos=Math.max(0,slides.findIndex(x=>x.id===id));beat=Math.max(0,Math.min(slides[pos].builds-1,(Number(step)||1)-1));render()
}
function advance(dir){
 let p=pos,b=beat+dir;if(b>=slides[p].builds){p=Math.min(slides.length-1,p+1);b=0}else if(b<0){p=Math.max(0,p-1);b=slides[p].builds-1}jump(slides[p].id,b)
}
function render(){
 let x=slides[pos],d=data[x.lesson];n=x.lesson;s=beat;
 let h='',body='',foot='';
 const cap=t=>'<p class="label">'+esc(t)+'</p>',claim=t=>'<p class="claim">'+esc(t)+'</p>',lead=t=>'<p class="lead">'+esc(t)+'</p>';
 const ref='<cite><a href="'+sources[n]+'" target="_blank" rel="noopener">'+esc(sourcesLabel[n])+' ↗</a></cite>';
 if(x.type==='title'){body='<div class="center"><h1>The evolution of large language models</h1><p>From counting words to checking an assistant’s answer</p></div>'}
 if(x.type==='hook'){h='The dry wind carries ___';body=lead('Four training sentences end with the same two words. What would you predict?')+'<div class="pair"><div class="card">'+cap('Training examples')+['dust','dust','sand','dust'].map(t=>lead('The dry wind carries '+t+'.')).join('')+'</div>'+(beat>0?'<div class="card reveal">'+cap('Prediction from counts')+'<p class="big">¾ dust</p>'+lead('One of four continuations is “sand”.')+'</div>':'')+'</div>'+(beat>1?claim('Change “wind” to “truck”. A bigram that sees only “carries” gives exactly the same answer.'):'')}
 if(x.type==='road'){h='Part '+(x.part+1)+' · '+sections[x.part][0];body=lead(sections[x.part][2])+'<div class="road">'+sections.map((v,i)=>'<button data-go="part-'+(i+1)+'" class="'+(i===x.part?'active':'')+'">'+(i+1)+' · '+targets[i]+'</button>').join('')+'</div>'}
 if(x.type==='lesson'){
  h=d[0][1];body='<div class="cols"><div class="stack">'+drawing(n,beat)+'<div id="visual"></div></div><div class="stack">'+cap(d[0][2])+d.slice(1,beat+2).map((row,i)=>'<div class="'+(i===beat?'reveal':'')+'"><p class="claim">'+esc(row[0])+'</p>'+ (i===beat?lead(row[1]):'')+'</div>').join('')+'</div></div>';foot=ref;
 }
 if(x.type==='work'){
  h=d[0][1];body='<div class="eq">'+esc(d[4][0])+'</div>'+lead(d[4][1])+(beat>0?'<div class="report reveal">'+esc(d[5][0])+'</div>':'')+(beat>1?'<div class="reveal">'+claim(d[5][1])+'</div>':'');foot=ref;
 }
 if(x.type==='bridge'){body='<div class="center">'+cap('Into part '+(x.part+2))+'<h1>'+esc(bridges[x.part])+'</h1></div>'}
 if(x.type==='lab'){
  h='Lab · Audit a station answer';body='<div class="pair"><div class="card">'+cap('Station report · 09:00 UTC')+lead('Horizontal visibility 3 km. Cause unconfirmed.')+'</div><div class="card">'+cap('Generated answer')+lead('A dust storm reduced visibility to 3 km.')+'</div></div>'+claim('Which claim is supported? What evidence is missing?')+(beat>0?lead('“3 km” has direct support. The report gives no cause. Rewrite the answer so that each claim can be checked.'):'')+(beat>1?'<div class="report reveal">At 09:00 UTC the station reported 3 km visibility. The report leaves the cause open.</div>':'')
 }
 if(x.type==='recap'){h='What changed across the generations?';body=['Counts estimate likely continuations. Embeddings let similar contexts share evidence.','Recurrence carries a state forward. Attention reads earlier positions directly.','Pretraining fits text. Post-training shapes replies. External evidence and evaluation help us judge a particular answer.'].slice(0,beat+1).map((t,i)=>'<div class="card reveal">'+cap(['Predict','Read context','Answer and verify'][i])+lead(t)+'</div>').join('')}
 stage.innerHTML=(h?'<h1>'+esc(h)+'</h1>':'')+'<div class="content">'+body+'</div>'+foot;
 if(x.type==='lesson')visual();
 requestAnimationFrame(fitStage);
 $('rail').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',String(i===x.part)));
 $('status').textContent=(pos+1)+' / '+slides.length+(x.builds>1?'  ·  '+(beat+1)+'/'+x.builds:'');outline.value=x.id;
 $('back').disabled=!pos&&!beat;$('next').disabled=pos===slides.length-1&&beat===x.builds-1;
}
function fitStage(){
  stage.style.zoom='';if(innerWidth<=750||innerHeight<=520)return;
  const body=stage.querySelector('.content');if(!body)return;
  const space=body.clientHeight;const children=Array.from(body.children);
  const gap=parseFloat(getComputedStyle(body).rowGap)||0;
  const natural=children.reduce((sum,child)=>sum+child.getBoundingClientRect().height,0)+Math.max(0,children.length-1)*gap;
  if(space>0 && natural>space)body.style.zoom=String(Math.min(1,space/natural));
 }
 window.addEventListener('resize',()=>{const c=stage.querySelector('.content');if(c)c.style.zoom='';fitStage()});
 slides.forEach(x=>{let o=document.createElement('option');o.value=x.id;o.textContent=x.type==='lesson'?data[x.lesson][0][1]:x.type==='work'?'↳ Worked example and question':x.type==='road'?'Part '+(x.part+1)+' · '+sections[x.part][0]:({title:'Title',hook:'Opening example',bridge:'Connecting question',lab:'Station lab',recap:'Recap'})[x.type];outline.append(o)});
outline.onchange=()=>jump(outline.value);$('back').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);
document.addEventListener('click',e=>{let t=e.target.closest('[data-go]');if(t){jump(t.dataset.go);return}if(!e.target.closest('input,button,select,label,a,#visual,footer,nav')&&!window.getSelection()?.toString()&&!$('next').disabled)advance(1)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,button,a'))return;if(['ArrowRight',' ','PageDown'].includes(e.key)&&!$('next').disabled){e.preventDefault();advance(1)}if(['ArrowLeft','PageUp'].includes(e.key)&&!$('back').disabled){e.preventDefault();advance(-1)}});window.onhashchange=route;route();
</script></body></html>
